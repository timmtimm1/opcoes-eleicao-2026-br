name: atualizar-e-publicar

# Cron em UTC. B3 opera em BRT (UTC-3, sem horário de verão):
#   - "15 21 * * 1-5"  -> 18:15 BRT, dias úteis, ~1h após o fechamento do pregão
#   - "45 11 * * 1-5"  -> 08:45 BRT, dias úteis, ~1h antes da abertura
on:
  schedule:
    - cron: "15 21 * * 1-5"
    - cron: "45 11 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Atualizar site/data.json com cotações
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}   # opcional; funciona sem
        run: python automation/update_data.py

      - name: Commit se houver mudança nas cotações
        run: |
          if [ -n "$(git status --porcelain site/data.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data.json
            git commit -m "chore(dados): atualiza cotações [skip ci]"
            git push
          else
            echo "sem mudança nas cotações — nada a commitar"
          fi

  publicar:
    needs: atualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
